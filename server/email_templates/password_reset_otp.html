<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 40px;
    }

    .title {
      color: #2563eb;
      text-align: center;
    }

    .otp {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 8px;
      padding: 20px;
      margin: 25px 0;
      background: #f1f5f9;
      color: #2563eb;
      border-radius: 8px;
    }

    .footer {
      color: #777;
      font-size: 13px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2 class="title">
      Password Reset
    </h2>

    <p>
      Hello {{name}},
    </p>

    <p>
      We received a request to reset your password.
      Please use the OTP below.
    </p>

    <div class="otp">
      {{otp}}
    </div>

    <p>
      This OTP is valid for <strong>10 minutes</strong>.
    </p>

    <p>
      If you did not request a password reset,
      you can safely ignore this email.
    </p>

    <div class="footer">
      © I-Diligence Solution
    </div>

  </div>

</body>
</html>
